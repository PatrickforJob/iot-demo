<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>手機感測器 IoT 裝置</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1b1f24; --muted: #667085;
    --accent: #2563eb; --ok: #15803d; --warn: #b45309; --danger: #dc2626; --border: #e4e7ec;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1216; --card: #191d23; --text: #e8eaed; --muted: #9aa3ae;
      --accent: #60a5fa; --ok: #4ade80; --warn: #fbbf24; --danger: #f87171; --border: #2a3038; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif; }
  main { max-width: 480px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: 22px; margin: 4px 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 18px; line-height: 1.5; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 14px; }
  label { font-size: 14px; color: var(--muted); display: block; margin-bottom: 6px; }
  input { width: 100%; font-size: 20px; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--bg); color: var(--text); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  button { width: 100%; font-size: 20px; font-weight: 600; padding: 16px; border: 0; border-radius: 12px;
    background: var(--accent); color: #fff; cursor: pointer; }
  button.stop { background: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 15px; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--muted); margin-right: 6px; }
  .dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.err { background: var(--danger); }
  .big { font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .bar { height: 14px; background: var(--bg); border-radius: 7px; overflow: hidden; margin-top: 8px; }
  .bar > div { height: 100%; width: 0; background: var(--accent); transition: width .1s; }
  .axes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; text-align: center; font-variant-numeric: tabular-nums; }
  .axes div { background: var(--bg); border-radius: 8px; padding: 6px 0; font-size: 15px; }
  .axes span { display: block; font-size: 12px; color: var(--muted); }
  #alert { position: fixed; inset: 0; background: var(--danger); color: #fff; display: none;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; z-index: 10; }
  #alert.show { display: flex; }
  #alert .t1 { font-size: 40px; font-weight: 800; }
  #alert .t2 { font-size: 18px; margin-top: 12px; opacity: .9; }
  #alert button { margin-top: 30px; background: #fff; color: var(--danger); max-width: 280px; }
  .steps { font-size: 14px; color: var(--muted); line-height: 1.7; margin: 0; padding-left: 20px; }
</style>
</head>
<body>
<main>
  <h1>📱 我的手機是 IoT 裝置</h1>
  <p class="sub">這個網頁會讀取手機的加速度感測器，透過網路即時傳到雲端。只傳加速度數字，不會讀取照片、通訊錄或任何個人資料。</p>

  <div class="card" id="setup">
    <label for="name">你的代號</label>
    <input id="name" maxlength="12" autocomplete="off" placeholder="例如：A07">
    <div class="hint">請用座號或暱稱，不要用姓名或學號。</div>
  </div>

  <button id="btn">開始傳送</button>

  <div class="card" style="margin-top:14px">
    <div class="row"><span><span class="dot" id="netDot"></span><span id="netText">尚未連線</span></span><span id="sent" class="hint">已送出 0 包</span></div>
    <div style="margin-top:10px">
      <label>目前加速度大小（g，靜止時約 1.0）</label>
      <div class="big" id="mag">–</div>
      <div class="bar"><div id="magBar"></div></div>
      <div class="axes">
        <div><span>X</span><b id="ax">–</b></div>
        <div><span>Y</span><b id="ay">–</b></div>
        <div><span>Z</span><b id="az">–</b></div>
      </div>
    </div>
  </div>

  <div class="card">
    <ol class="steps">
      <li>輸入代號，按「開始傳送」，允許存取動作感測器。</li>
      <li>看投影幕，找到你的代號，搖一搖手機看波形變化。</li>
      <li>模擬跌倒：手機握緊，手快速往下甩再突然停住。</li>
      <li>雲端偵測到跌倒時，這個畫面會變紅色。</li>
    </ol>
  </div>
</main>

<div id="alert">
  <div class="t1">⚠️ 偵測到跌倒！</div>
  <div class="t2">雲端 AI 判斷你可能跌倒了<br>（真實系統會通知護理站）</div>
  <button id="ack">我沒事</button>
</div>

<script src="config.js"></script>
<script src="lib/mqtt.min.js"></script>
<script>
(function () {
  var C = window.IOT_CONFIG;
  var $ = function (id) { return document.getElementById(id); };
  var G = 9.80665;
  var client = null, running = false, buf = [], sentCount = 0, sendTimer = null, wakeLock = null, deviceId = '';
  var gotMotion = false;

  try { $('name').value = localStorage.getItem('iot-name') || ''; } catch (e) {}

  function setNet(state, text) {
    $('netDot').className = 'dot ' + state;
    $('netText').textContent = text;
  }

  function cleanId(s) {
    return (s || '').trim().replace(/[\/#+\s]/g, '').slice(0, 12);
  }

  function onMotion(e) {
    var a = e.accelerationIncludingGravity;
    if (!a || a.x === null) return;
    gotMotion = true;
    var x = a.x / G, y = a.y / G, z = a.z / G;
    var m = Math.sqrt(x * x + y * y + z * z);
    buf.push([Date.now(), +x.toFixed(3), +y.toFixed(3), +z.toFixed(3)]);
    $('mag').textContent = m.toFixed(2) + ' g';
    $('magBar').style.width = Math.min(100, m / 4 * 100) + '%';
    $('ax').textContent = x.toFixed(2); $('ay').textContent = y.toFixed(2); $('az').textContent = z.toFixed(2);
  }

  function flush() {
    if (!client || !client.connected || buf.length === 0) { if (buf.length > 200) buf = buf.slice(-200); return; }
    var payload = JSON.stringify({ id: deviceId, s: buf });
    buf = [];
    client.publish(C.topicBase + '/' + deviceId + '/acc', payload, { qos: 0 });
    sentCount++;
    $('sent').textContent = '已送出 ' + sentCount + ' 包';
  }

  function connect() {
    setNet('warn', '連線到雲端中…');
    client = mqtt.connect(C.brokerUrl, {
      clientId: 'phone-' + deviceId + '-' + Math.random().toString(16).slice(2, 8),
      clean: true, reconnectPeriod: 2000, connectTimeout: 8000
    });
    client.on('connect', function () {
      setNet('ok', '已連線到雲端（' + C.brokerUrl.split('/')[2].split(':')[0] + '）');
      client.subscribe(C.topicBase + '/' + deviceId + '/alert');
    });
    client.on('reconnect', function () { setNet('warn', '重新連線中…'); });
    client.on('offline', function () { setNet('err', '網路中斷，重試中…'); });
    client.on('error', function () { setNet('err', '連線失敗（網路可能被擋，試試改用手機網路）'); });
    client.on('message', function (topic, msg) {
      if (topic.slice(-6) === '/alert') {
        $('alert').classList.add('show');
        if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 400]);
      }
    });
  }

  async function start() {
    deviceId = cleanId($('name').value);
    if (!deviceId) { alert('請先輸入代號'); return; }
    $('name').value = deviceId;
    try { localStorage.setItem('iot-name', deviceId); } catch (e) {}

    // iPhone 需要使用者按按鈕後明確授權
    if (typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function') {
      try {
        var p = await DeviceMotionEvent.requestPermission();
        if (p !== 'granted' && /iPhone|iPad|iPod/.test(navigator.userAgent)) { alert('需要允許「動作與方向」才能讀取感測器。請重新整理頁面再按一次。'); return; }
      } catch (e) { /* 部分 Android 瀏覽器不支援此 API，直接繼續；沒資料時下方會提示 */ }
    }
    window.addEventListener('devicemotion', onMotion);
    running = true;
    $('btn').textContent = '停止傳送';
    $('btn').classList.add('stop');
    $('name').disabled = true;
    connect();
    sendTimer = setInterval(flush, C.sendIntervalMs);
    try { if (navigator.wakeLock) wakeLock = await navigator.wakeLock.request('screen'); } catch (e) {}
    setTimeout(function () {
      if (running && !gotMotion) alert('沒有收到感測器資料。請確認是用手機開啟（電腦沒有加速度計），並使用 Safari 或 Chrome。');
    }, 2500);
  }

  function stop() {
    running = false;
    window.removeEventListener('devicemotion', onMotion);
    clearInterval(sendTimer);
    if (client) { client.end(true); client = null; }
    if (wakeLock) { try { wakeLock.release(); } catch (e) {} wakeLock = null; }
    setNet('', '已停止');
    $('btn').textContent = '開始傳送';
    $('btn').classList.remove('stop');
    $('name').disabled = false;
  }

  $('btn').addEventListener('click', function () { running ? stop() : start(); });
  $('ack').addEventListener('click', function () { $('alert').classList.remove('show'); });
})();
</script>
</body>
</html>
